name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Run Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: Check docs
      run: cargo doc --no-deps --locked
      env:
        RUSTDOCFLAGS: "-D warnings"
    # `--locked` fails the build when Cargo.toml and Cargo.lock disagree,
    # so a dependency bump can never land without its lockfile update.
    - name: Build
      run: cargo build --verbose --locked
    - name: Run tests
      run: cargo test --verbose --locked

  msrv:
    # Roadmap F0.2: the declared MSRV is load-bearing. Build and test on
    # exactly the toolchain named by `package.rust-version` in Cargo.toml —
    # read dynamically so there is a single source of truth.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Read declared MSRV from Cargo.toml
      id: msrv
      run: |
        version=$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[] | select(.name == "igloo") | .rust_version')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Declared MSRV: $version"
    - name: Install Rust toolchain (${{ steps.msrv.outputs.version }})
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.msrv.outputs.version }}
    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2
    - name: Check with locked dependencies
      run: cargo check --all-targets --locked
    - name: Test with locked dependencies
      run: cargo test --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Check licenses and security advisories
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational for now (roadmap F0.1): surfaces the coverage trend
    # without blocking merges. Flip to blocking once a baseline exists.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Report unit-test coverage
      run: cargo llvm-cov --summary-only --locked

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: igloo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ADBC integration drivers
      run: |
        python -m pip install adbc-driver-sqlite==1.7.0 adbc-driver-postgresql==1.7.0
        python - <<'PY'
        import os
        from pathlib import Path
        import adbc_driver_sqlite
        import adbc_driver_postgresql
        with open(os.environ["GITHUB_ENV"], "a") as output:
            for name, module in [("SQLITE", adbc_driver_sqlite), ("POSTGRES", adbc_driver_postgresql)]:
                library = Path(module.__file__).parent / ("libadbc_driver_" + ("sqlite" if name == "SQLITE" else "postgresql") + ".so")
                if not library.is_file():
                    raise RuntimeError("Required ADBC test driver was not installed")
                output.write("IGLOO_TEST_ADBC_" + name + "_DRIVER=" + str(library) + "\n")
        PY
    # Seeds crypto_assets for the crypto-metrics federated integration test;
    # every other live-database test creates its own uniquely-named tables.
    - name: Enable native logical replication in the disposable test service
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d igloo_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET wal_level = 'logical'"
        docker restart "${{ job.services.postgres.id }}"
        for attempt in $(seq 1 30); do
          if pg_isready -h localhost -U postgres -d igloo_test; then
            exit 0
          fi
          sleep 1
        done
        exit 1
    - name: Seed integration database
      run: psql 'postgres://postgres:postgres@localhost:5432/igloo_test' -f scripts/seed_test_db.sql
    - name: Run integration tests
      run: |
        cargo test --lib integration_ --locked -- --nocapture
        cargo test --test postgres_federation --locked -- --nocapture
        cargo test --test catalog --locked -- --nocapture
        cargo test --test pushdown --locked -- --nocapture
        cargo test --test multi_source --locked -- --nocapture
        cargo test --test pgwire_server --locked -- --nocapture --test-threads=2
        cargo test --test agent_access --locked -- --nocapture --test-threads=2
        cargo test --test connectors --locked -- --nocapture --test-threads=2
        cargo test --test postgres_cdc --locked -- --nocapture --test-threads=2
        cargo test --test cache_invalidation_race --locked -- --nocapture
      env:
        IGLOO_TEST_POSTGRES_URI: postgres://postgres:postgres@localhost:5432/igloo_test
